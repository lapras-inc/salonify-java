<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: pagehead(${salon.name} + ' — Salonify')}"></head>
<body>
<header th:replace="~{fragments/common :: siteheader}"></header>
<main class="container">
    <div th:replace="~{fragments/common :: flash}"></div>

    <div class="card" style="padding:0;overflow:hidden;">
        <div class="cover" style="height:120px;" th:if="${salon.coverUrl == null}" th:text="${salon.category}">CATEGORY</div>
        <img th:if="${salon.coverUrl != null}" th:src="${salon.coverUrl}" alt="" style="width:100%;height:120px;object-fit:cover;">
        <div style="padding:16px;">
            <h1 th:text="${salon.name}">サロン名</h1>
            <p class="muted" th:text="${salon.tagline}">キャッチコピー</p>
            <nav style="margin-top:8px;">
                <a class="btn btn-sm" th:href="@{/salons/{id}/posts(id=${salon.id})}">投稿一覧</a>
                <a class="btn btn-sm" th:href="@{/salons/{id}/board(id=${salon.id})}">掲示板</a>
                <a th:if="${isOwner}" class="btn btn-sm btn-secondary" th:href="@{/owner/salons/{id}/dashboard(id=${salon.id})}">運営</a>
            </nav>
        </div>
    </div>

    <div class="card" th:if="${!isOwner and myPlan != null}">
        <h2>現在のプラン</h2>
        <p><strong th:text="${myPlan.name}">プラン</strong> — <span th:text="'¥' + ${myPlan.priceJpy} + '/月'">¥0</span></p>
        <a class="btn btn-sm btn-secondary" th:href="@{/salons/{id}(id=${salon.id})}">プラン変更</a>
        <form th:action="@{/api/membership/cancel}" method="post" class="inline"
              onsubmit="return confirm('このサロンを退会しますか？');">
            <input type="hidden" name="membershipId" th:value="${membership.id}">
            <input type="hidden" name="redirect" th:value="'/salons/' + ${salon.id}">
            <button type="submit" class="linklike" style="color:#dc2626;">退会する</button>
        </form>
    </div>

    <div class="card">
        <h2>最新の投稿</h2>
        <p th:if="${posts.isEmpty()}" class="muted">まだ投稿がありません。</p>
        <ul>
            <li th:each="v : ${posts}" th:style="${v.canView} ? '' : 'opacity:0.6;'">
                <span th:if="${v.post.pinned}">📌</span>
                <a th:if="${v.canView}" th:href="@{/salons/{id}/posts/{pid}(id=${salon.id},pid=${v.post.id})}" th:text="${v.post.title}">タイトル</a>
                <span th:unless="${v.canView}" th:text="'🔒 ' + ${v.post.title}">タイトル</span>
                <span th:replace="~{fragments/common :: postBadge(${v.planName})}"></span>
            </li>
        </ul>
    </div>

    <div class="card">
        <h2>最新のスレッド</h2>
        <p th:if="${threads.isEmpty()}" class="muted">まだスレッドがありません。</p>
        <ul>
            <li th:each="v : ${threads}">
                <a th:href="@{/salons/{id}/board/all/{tid}(id=${salon.id},tid=${v.thread.id})}" th:text="${v.thread.title}">スレッド</a>
                <span class="muted" th:text="' (返信 ' + ${v.replyCount} + ')'"></span>
            </li>
        </ul>
    </div>
</main>
<footer th:replace="~{fragments/common :: sitefooter}"></footer>
</body>
</html>
