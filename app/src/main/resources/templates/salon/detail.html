<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: pagehead(${salon.name} + ' — Salonify')}"></head>
<body>
<header th:replace="~{fragments/common :: siteheader}"></header>
<main class="container">
    <div th:replace="~{fragments/common :: flash}"></div>

    <!-- private (legacy) locked -->
    <div th:if="${privateLocked}" class="card">
        <h1 th:text="${salon.name}">サロン</h1>
        <p class="muted">このサロンは招待URL限定です。オーナーから共有された招待URLからアクセスしてください。</p>
    </div>

    <div th:unless="${privateLocked}">
        <div class="card" style="padding:0; overflow:hidden;">
            <div class="cover" style="height:180px;" th:if="${salon.coverUrl == null}" th:text="${salon.category}">CATEGORY</div>
            <img th:if="${salon.coverUrl != null}" th:src="${salon.coverUrl}" alt="" style="width:100%;height:180px;object-fit:cover;">
            <div style="padding:16px;">
                <span class="pill" th:text="${salon.category}">カテゴリ</span>
                <h1 style="margin:8px 0 4px;" th:text="${salon.name}">サロン名</h1>
                <p class="muted" th:text="${salon.tagline}">キャッチコピー</p>
                <p class="muted" th:text="'アクティブ会員 ' + ${activeCount} + '人'">会員数</p>
            </div>
        </div>

        <div class="card prose">
            <h2>このサロンについて</h2>
            <div th:utext="${descriptionHtml}">説明</div>
        </div>

        <div class="card" th:if="${owner != null}">
            <h2>オーナー</h2>
            <div style="display:flex;align-items:center;gap:12px;">
                <img th:if="${owner.avatarUrl != null}" th:src="${owner.avatarUrl}" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover;">
                <div>
                    <strong th:text="${owner.displayName}">オーナー名</strong>
                    <p class="muted" th:if="${owner.bio != null}" th:text="${owner.bio}">自己紹介</p>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>料金プラン</h2>
            <p th:if="${!inviteAllowed}" class="flash flash-error">このサロンは招待URL限定です。有効な招待URLからアクセスすると入会できます。</p>
            <div class="grid">
                <div class="card" th:each="plan : ${plans}">
                    <h3 th:text="${plan.name}">プラン名</h3>
                    <p style="font-size:20px;font-weight:700;" th:text="'¥' + ${plan.priceJpy} + ' / 月'">¥0/月</p>
                    <p class="muted" th:if="${plan.trialDays > 0}" th:text="${plan.trialDays} + '日間の無料トライアル'"></p>
                    <p class="muted" th:if="${plan.introDiscount > 0}" th:text="'初月 ¥' + ${plan.introDiscount} + ' 割引'"></p>
                    <p class="muted" th:if="${plan.description != null}" th:text="${plan.description}"></p>

                    <div style="margin-top:8px;">
                        <span th:if="${isOwner}" class="btn disabled">オーナーとして運営中</span>
                        <span th:if="${!isOwner and myActivePlanId == plan.id}" class="btn disabled">✓ 現在のプラン</span>
                        <th:block th:if="${!isOwner and myActivePlanId != plan.id}">
                            <a th:if="${inviteAllowed}" class="btn"
                               th:href="@{/salons/{id}/join(id=${salon.id},plan=${plan.id},invite=${inviteCode})}"
                               th:text="${isActiveMember} ? 'このプランに変更' : 'このプランで入会'">入会</a>
                            <span th:unless="${inviteAllowed}" class="btn disabled">招待が必要です</span>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <a th:if="${isActiveMember}" class="btn" th:href="@{/salons/{id}/home(id=${salon.id})}">サロンのメインページを表示</a>
            <a th:if="${isOwner}" class="btn btn-secondary" th:href="@{/owner/salons/{id}/dashboard(id=${salon.id})}">運営ダッシュボード</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/common :: sitefooter}"></footer>
</body>
</html>
