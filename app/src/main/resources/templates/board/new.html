<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: pagehead('新規スレッド — Salonify')}"></head>
<body>
<header th:replace="~{fragments/common :: siteheader}"></header>
<main class="container">
    <p><a th:href="@{/salons/{id}/board/{cat}(id=${salon.id},cat=${categoryId})}">← スレッド一覧</a></p>
    <h1>新規スレッド</h1>
    <form th:action="@{/api/salons/{id}/threads/create(id=${salon.id})}" method="post" class="card">
        <input type="hidden" name="categoryId" th:value="${categoryId}">
        <label>タイトル</label>
        <input type="text" name="title" maxlength="200" required>
        <label>本文（Markdown可）</label>
        <textarea name="body" required></textarea>
        <div style="margin-top:12px;"><button type="submit" class="btn">スレッドを作成</button></div>
    </form>
</main>
<footer th:replace="~{fragments/common :: sitefooter}"></footer>
</body>
</html>
