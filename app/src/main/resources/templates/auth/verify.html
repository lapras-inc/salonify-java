<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: pagehead('メール認証 — Salonify')}"></head>
<body>
<header th:replace="~{fragments/common :: siteheader}"></header>
<main class="container">
    <div class="card form-narrow">
        <h1>メール認証</h1>
        <p class="muted">「<span th:text="${email}">x</span>」に送信した6桁の認証コードを入力してください。</p>

        <div th:if="${devCode != null}" class="dev-code">
            [開発用] メールは送信されません。認証コード: <strong th:text="${devCode}">000000</strong>
        </div>

        <p th:if="${error == 'invalid'}" class="flash flash-error">コードが正しくないか、有効期限が切れています</p>
        <p th:if="${error == 'exists'}" class="flash flash-error">このメールアドレスは登録済みです</p>
        <p th:if="${error == 'rate'}" class="flash flash-error">試行回数が多すぎます。しばらくお待ちください</p>

        <form th:action="@{/api/auth/verify}" method="post">
            <input type="hidden" name="email" th:value="${email}">
            <input type="hidden" name="next" th:value="${next}">
            <label>認証コード（6桁）</label>
            <input type="text" name="code" inputmode="numeric" maxlength="6" required>
            <div style="margin-top:16px;">
                <button type="submit" class="btn">認証する</button>
            </div>
        </form>

        <form th:action="@{/api/auth/resend-code}" method="post" style="margin-top:12px;">
            <input type="hidden" name="email" th:value="${email}">
            <button type="submit" class="linklike">コードを再送する</button>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/common :: sitefooter}"></footer>
</body>
</html>
