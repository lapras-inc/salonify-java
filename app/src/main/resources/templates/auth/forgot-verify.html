<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: pagehead('パスワード再設定 — Salonify')}"></head>
<body>
<header th:replace="~{fragments/common :: siteheader}"></header>
<main class="container">
    <div class="card form-narrow">
        <h1>新しいパスワードの設定</h1>
        <p class="muted">「<span th:text="${email}">x</span>」宛のリセットコードと新しいパスワードを入力してください。</p>

        <div th:if="${devCode != null}" class="dev-code">
            [開発用] メールは送信されません。リセットコード: <strong th:text="${devCode}">000000</strong>
        </div>

        <p th:if="${error == 'invalid'}" class="flash flash-error">コードが正しくないか、有効期限が切れています</p>
        <p th:if="${error == 'mismatch'}" class="flash flash-error">パスワードが一致しません</p>
        <p th:if="${error == 'short'}" class="flash flash-error">パスワードは8文字以上にしてください</p>
        <p th:if="${error == 'rate'}" class="flash flash-error">試行回数が多すぎます。しばらくお待ちください</p>

        <form th:action="@{/api/auth/reset-password}" method="post">
            <input type="hidden" name="email" th:value="${email}">
            <label>リセットコード（6桁）</label>
            <input type="text" name="code" inputmode="numeric" maxlength="6" required>
            <label>新しいパスワード（8文字以上）</label>
            <input type="password" name="password" minlength="8" required>
            <label>新しいパスワード（確認）</label>
            <input type="password" name="confirmPassword" minlength="8" required>
            <div style="margin-top:16px;">
                <button type="submit" class="btn">パスワードを変更する</button>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/common :: sitefooter}"></footer>
</body>
</html>
